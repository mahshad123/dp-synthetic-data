[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpsynth"
version = "0.1.0"
description = "Differentially private synthetic tabular data (MST from first principles) with zCDP accounting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mahshad Shariatnasab"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
bench = ["matplotlib>=3.7", "tabulate>=0.9"]
dev = ["pytest>=7"]

[project.scripts]
dpsynth = "dpsynth.__main__:main"

[tool.setuptools]
packages = ["dpsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
